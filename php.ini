; Anisync MBL — per-instance PHP settings (loaded via PHPRC in lighttpd.conf).
; This does NOT touch the system-wide /etc/php5/cgi/php.ini used by the
; WD My Book Live dashboard on port 80.

memory_limit = 48M
max_execution_time = 30
max_input_time = 30
upload_max_filesize = 8M
post_max_size = 8M
default_socket_timeout = 15
expose_php = Off
display_errors = Off
log_errors = On
error_log = /DataVolume/anisync/logs/php-error.log

; ---- v12 NAS tuning ----------------------------------------------------------
; The PHP sources total ~300 KB and PHP re-parses them on EVERY request (no
; opcode cache on this build). Larger realpath + stat caches cut syscall
; churn from the cascade of require_once calls per request.
realpath_cache_size = 96K
realpath_cache_ttl = 600
; Long audit endpoints (verify-batch / resolve-batch) raise their own limits
; at runtime via set_time_limit(); the 30s default above still protects the
; ordinary request paths.
; SQLite in PDO needs this so long JSON strings don't hit the 1M default.
; (PDO sqlite driver respects it since 5.3.)
pdo_sqlite.db_extension = "pdo_sqlite.so" ; harmless on modern PHP, ignored if unknown
