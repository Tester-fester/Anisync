# =============================================================================
# Anisync MBL — lighttpd instance #2 (port 3000)
# WD My Book Live (PowerPC, Debian Squeeze, lighttpd 1.4.28)
#
# Runs ALONGSIDE the stock lighttpd on :80 (WD dashboard + MyBook Cloud app).
# Start/stop via /etc/init.d/anisync.
#
# Layout:
#   /DataVolume/anisync/public/         docroot (React build + api/)
#   /DataVolume/anisync/public/api/     PHP backend (router = index.php)
#   /DataVolume/anisync/data/           SQLite DB
#   /DataVolume/anisync/logs/           access/error/php logs
# =============================================================================

server.modules = (
    "mod_access",
    "mod_rewrite",
    "mod_fastcgi",
    "mod_accesslog",
    "mod_compress",   # v12: gzip static assets at serve-time (cached on disk)
    "mod_expire",     # v12: immutable Cache-Control for hashed /assets/
)

server.port          = 3000
server.bind          = "0.0.0.0"
server.document-root = "/DataVolume/anisync/public"
server.pid-file      = "/tmp/anisync-lighttpd.pid"
server.errorlog      = "/DataVolume/anisync/logs/error.log"
server.tag           = "anisync"
server.username = "www-data"
server.groupname = "www-data"
server.max-connections = 24
server.event-handler = "poll"          # safest handler on kernel 2.6.32/ppc

index-file.names = ("index.html")

accesslog.filename = "/DataVolume/anisync/logs/access.log"
accesslog.format   = "%h %V %u %t \"%r\" %>s %b \"%{User-Agent}i\""

# ---- API: /api/* and /health → PHP router (single rewrite-once!) ------------
# (lighttpd 1.4 does NOT support "+=" for rewrites — all rules in one block.)
# REQUEST_URI keeps the original path after the rewrite — that is what
# api/index.php parses.
url.rewrite-once = (
    "^/api(/.*)?$" => "/api/index.php",
    "^/health$"    => "/api/index.php",
)

# ---- Block direct fetches of non-entry PHP/data files (defense in depth) ----
# (They output nothing when executed anyway, but no reason to allow probes.)
$HTTP["url"] =~ "^/api/(config\.php|seed\.json|schema\.sql|lib\.php|routes_.+\.php)$" {
    url.access-deny = ( "" )
}

# ---- Static asset caching (Vite emits content-hashed filenames) -------------
# v12 NAS: was an EMPTY block with a commented-out expire — 2.5 MB of hashed
# JS/CSS was re-downloaded (or at least revalidated) on every visit.
# Hashed Vite chunks (name-HASH8.js|css) are immutable -> cache a year.
$HTTP["url"] =~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    expire.url = ( "" => "access plus 365 days" )
}
# The runtime patch file is NOT content-hashed (it changes between deploys)
# — short cache so player fixes reach existing clients quickly.
$HTTP["url"] =~ "^/assets/anisync-patches\.js$" {
    expire.url = ( "" => "access plus 5 minutes" )
}
compress.filetype = (
    "text/html", "text/css", "text/plain", "text/javascript",
    "application/javascript", "application/json",
)
compress.cache-dir = "/tmp/anisync-compress"
# NOTE: create the compress dir on the NAS once (writable by www-data):
#   mkdir -p /tmp/anisync-compress && chown www-data:www-data /tmp/anisync-compress
# index.html must NOT be long-cached (hashed asset names change between
# deploys); API responses are gzipped in PHP (json_out), not here (dynamic).

# ---- SPA fallback: unknown paths serve index.html ----------------------------
server.error-handler-404 = "/index.html"

# ---- PHP via FastCGI (own socket + own php-cgi pool) --------------------------
# PHPRC points the cgi binary at our per-instance php.ini.
# NOTE: lighttpd >= 1.4.26 forwards the Authorization header to FastCGI,
# so Bearer tokens work (this app requires PHP 5.3's $_SERVER['HTTP_AUTHORIZATION']).
# v4 FIX: pool raised 2 → 4 children. With 2, a long stream-audit request
# (verify-batch/resolve-batch run dozens of YouTube lookups) could occupy a
# worker for many seconds and queue every other request — the UI "froze"
# for ~4s whenever someone searched during an audit.
fastcgi.server = ( ".php" => ((
    "bin-path" => "/usr/bin/php-cgi",
    "socket"   => "/tmp/anisync-php.socket",
    "max-procs" => 1,
    "bin-environment" => (
        "PHP_FCGI_CHILDREN"     => "4",
        "PHP_FCGI_MAX_REQUESTS" => "500",
        "PHPRC"                 => "/DataVolume/anisync",
    ),
    "broken-scriptfilename" => "enable",
)))

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".htm"  => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif"  => "image/gif",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".webp" => "image/webp",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2",
    ".ttf"  => "font/ttf",
    ".otf"  => "font/otf",
    ".txt"  => "text/plain; charset=utf-8",
    ".map"  => "application/json; charset=utf-8",
)
